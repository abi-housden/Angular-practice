<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#4A90E2" opacity="0.1"/>
  
  <!-- Main notepad shape -->
  <rect x="50" y="40" width="100" height="130" rx="4" fill="#FFFFFF" stroke="#4A90E2" stroke-width="3"/>
  
  <!-- Spiral binding holes -->
  <circle cx="65" cy="50" r="4" fill="#4A90E2"/>
  <circle cx="85" cy="50" r="4" fill="#4A90E2"/>
  <circle cx="105" cy="50" r="4" fill="#4A90E2"/>
  <circle cx="125" cy="50" r="4" fill="#4A90E2"/>
  <circle cx="145" cy="50" r="4" fill="#4A90E2"/>
  
  <!-- Horizontal lines representing text -->
  <line x1="65" y1="75" x2="135" y2="75" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  <line x1="65" y1="90" x2="135" y2="90" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  <line x1="65" y1="105" x2="120" y2="105" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  <line x1="65" y1="120" x2="135" y2="120" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  <line x1="65" y1="135" x2="110" y2="135" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  
  <!-- Pencil -->
  <g transform="translate(125, 130) rotate(-45)">
    <!-- Pencil body -->
    <rect x="0" y="0" width="35" height="8" rx="1" fill="#FFD700"/>
    <!-- Pencil tip -->
    <polygon points="35,0 45,4 35,8" fill="#FFA500"/>
    <!-- Pencil eraser -->
    <rect x="-6" y="0" width="6" height="8" rx="1" fill="#FF69B4"/>
    <!-- Eraser holder -->
    <rect x="-2" y="0" width="2" height="8" fill="#C0C0C0"/>
  </g>
</svg>